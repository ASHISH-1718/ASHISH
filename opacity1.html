<html>
<head>
	
	<title>CSS opacity Example</title>
	<style>
.A1{background-color:red;
opacity:1;}
.A2{background-color:red;
opacity:0.75;}
.A3{background-color:red;
opacity:0.5;}
.A4{background-color:red;
opacity:0.2;}



</style>

</head>
<body>
	<div class="A1"> 
	Opacity 1
</div>
	<div class="A2">
    Opacity 0.75
</div>
	<div class="A3">
	Opacity 0.5
</div>
</div>
	<div class="A4">
	Opacity 0.2
</div>



</body>
</html>
